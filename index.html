<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王东旭 · 软件工程师</title>
  <meta name="description" content="王东旭 · 软件工程师 —— 数据运维 / 自动化运维平台 / CI 自动化平台 / 图像算法 / AIGC 探索。" />
  <link rel="stylesheet" href="vendor/element-ui.css" />
  <link rel="stylesheet" href="vendor/logicflow.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部：名字 + 简介 -->
    <header class="topbar">
      <div class="topbar__inner">
        <h1 class="topbar__name">王东旭</h1>
        <p class="topbar__intro">软件工程师 · 数据运维 / 自动化运维 / 图像算法 / AIGC</p>
      </div>
    </header>

    <!-- 标签页（Element UI） -->
    <main class="content">
      <el-tabs v-model="active" class="mytabs">
        <el-tab-pane label="数据运维" name="data">
          <div class="panel">
            <h2 class="panel__title">数据运维</h2>
            <p class="panel__lead">月基线与日常 Bug 的运维处理流程，含两条主线：① SQL 数据库初始化 ② Tomcat / Linux 生产部署验证。下方为可拖拽/缩放的真流程图。</p>
            <div class="flow">
              <div id="dataFlow" class="flow-canvas"></div>
              <p class="flow__hint">提示：可滚动滚轮缩放、按住空白处拖拽画布。</p>
            </div>
          </div>
        </el-tab-pane>
        <el-tab-pane label="自动化运维平台" name="autoops">
          <div class="panel">
            <h2 class="panel__title">自动化运维平台</h2>
            <p class="panel__lead">内容待补充</p>
          </div>
        </el-tab-pane>
        <el-tab-pane label="CI 自动化平台" name="ci">
          <div class="panel">
            <h2 class="panel__title">CI 自动化平台</h2>
            <p class="panel__lead">内容待补充</p>
          </div>
        </el-tab-pane>
        <el-tab-pane label="图像算法" name="image">
          <div class="panel">
            <h2 class="panel__title">图像算法</h2>
            <p class="panel__lead">内容待补充</p>
          </div>
        </el-tab-pane>
        <el-tab-pane label="AIGC 探索" name="aigc">
          <div class="panel">
            <h2 class="panel__title">AIGC 探索</h2>
            <p class="panel__lead">内容待补充</p>
          </div>
        </el-tab-pane>
      </el-tabs>
    </main>

    <footer class="footer">
      <span>© 2026 王东旭</span>
      <span><a href="https://github.com/wangdongxu520" target="_blank" rel="noopener">GitHub</a> · <a href="mailto:hello@example.com">Email</a></span>
    </footer>
  </div>

  <script src="vendor/vue.min.js"></script>
  <script src="vendor/element-ui.js"></script>
  <script src="vendor/logicflow.js"></script>
  <script>
    new Vue({
      el: "#app",
      data: { active: "data" },
      mounted() {
        this.$nextTick(this.initFlow);
      },
      methods: {
        initFlow() {
          if (typeof LogicFlow === "undefined") return;
          var container = document.getElementById("dataFlow");
          if (!container) return;

          var lf = new LogicFlow({
            container: container,
            grid: { size: 12, type: "mesh", config: { color: "#eef1f7" } },
            keyboard: { enabled: false },
            adjustEdge: false,
            theme: {
              rect: { radius: 8, fill: "#eef1fb", stroke: "#3b5bdb", strokeWidth: 1.5 },
              text: { color: "#16181d", fontSize: 13 },
              edge: { stroke: "#9aa3b2", strokeWidth: 1.5 },
              arrow: { offset: 8, verticalLength: 4 }
            }
          });

          // 节点工厂：kind 决定配色（trigger 蓝 / end 绿 / 普通 浅蓝）
          function mk(id, x, y, label, kind) {
            var t = { value: label };
            var s = { strokeWidth: 1.5, radius: 8 };
            if (kind === "trigger") {
              t.fill = "#ffffff"; s.fill = "#3b5bdb"; s.stroke = "#3b5bdb";
            } else if (kind === "end") {
              t.fill = "#ffffff"; s.fill = "#1f9d55"; s.stroke = "#1f9d55";
            } else {
              t.fill = "#16181d"; s.fill = "#eef1fb"; s.stroke = "#3b5bdb";
            }
            return { id: id, type: "rect", x: x, y: y, text: t, style: s };
          }

          lf.render({
            nodes: [
              mk("a", 430, 70, "月基线切板预热", "trigger"),
              mk("b", 120, 70, "日常月基线 bug", "trigger"),
              mk("c", 580, 190, "开发准备 sql", "normal"),
              mk("g", 250, 190, "开发准备 tomcat 包", "normal"),
              mk("d", 580, 310, "运维组长建工程表", "normal"),
              mk("h", 250, 310, "运维 linux 环境部署", "normal"),
              mk("e", 580, 430, "运维执行 sql", "normal"),
              mk("i", 250, 430, "生产验证", "end"),
              mk("f", 580, 550, "数据库初始化完成", "end")
            ],
            edges: [
              { sourceNodeId: "a", targetNodeId: "c", type: "polyline" },
              { sourceNodeId: "a", targetNodeId: "g", type: "polyline" },
              { sourceNodeId: "b", targetNodeId: "g", type: "polyline" },
              { sourceNodeId: "c", targetNodeId: "d", type: "polyline" },
              { sourceNodeId: "g", targetNodeId: "h", type: "polyline" },
              { sourceNodeId: "d", targetNodeId: "e", type: "polyline" },
              { sourceNodeId: "h", targetNodeId: "i", type: "polyline" },
              { sourceNodeId: "e", targetNodeId: "f", type: "polyline" }
            ]
          });

          lf.translateCenter();
          try { lf.fitView(); } catch (err) { /* 部分版本无 fitView，忽略 */ }
        }
      }
    });
  </script>
</body>
</html>
